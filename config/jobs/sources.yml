# ---------------------------------------------------- job-board systems: one example board each
# The universe test (below) samples many boards per system; these show each system's full shape.
- id: board-greenhouse
  name: Greenhouse (Anthropic's board)
  family: board
  url: https://boards-api.greenhouse.io/v1/boards/anthropic/jobs
  probe:
    kind: json
    items: jobs
    title: title
    date: first_published
    count: meta.total
    fields: {location: location.name, updated_at: updated_at, first_published: first_published, url: absolute_url}

- id: board-lever
  name: Lever (Palantir's board)
  family: board
  url: https://api.lever.co/v0/postings/palantir?mode=json
  probe:
    kind: json
    items: ""
    title: text
    date: createdAt
    fields: {location: categories.location, created: createdAt, workplace: workplaceType, pay: salaryRange,
             commitment: categories.commitment, url: hostedUrl}

- id: board-ashby
  name: Ashby (OpenAI's board)
  family: board
  url: https://api.ashbyhq.com/posting-api/job-board/openai?includeCompensation=true
  probe:
    kind: json
    items: jobs
    title: title
    date: publishedAt
    fields: {location: location, remote: isRemote, workplace: workplaceType, pay: compensation.compensationTierSummary,
             published: publishedAt, url: jobUrl}

- id: board-workable
  name: Workable (Hugging Face's board)
  family: board
  url: https://apply.workable.com/api/v1/widget/accounts/huggingface
  probe:
    kind: json
    items: jobs
    title: title
    date: published_on
    fields: {country: country, city: city, remote: telecommuting, published: published_on, url: url}

- id: board-smartrecruiters
  name: SmartRecruiters (Visa's board)
  family: board
  enabled: false
  url: https://api.smartrecruiters.com/v1/companies/Visa/postings?limit=100
  probe:
    kind: json
    items: content
    title: name
    date: releasedDate
    count: totalFound
    fields: {country: location.country, city: location.city, remote: location.remote, released: releasedDate}
  notes: "OFF: api.smartrecruiters.com robots.txt allows /v1/companies/ only to LinkedInBot (User-agent: * Disallow: /),
    checked 2026-11-04. SmartRecruiters jobs reach us through the community lists and LinkedIn alerts."

- id: board-recruitee
  name: Recruitee (Hatchtech's board)
  family: board
  url: https://hatchtech.recruitee.com/api/offers/
  probe:
    kind: json
    items: offers
    title: title
    date: published_at
    fields: {country: country, city: city, remote: remote, published: published_at, pay: salary.min, url: careers_url}

- id: board-workday
  name: Workday (NVIDIA's board)
  family: board
  method: POST
  url: https://nvidia.wd5.myworkdayjobs.com/wday/cxs/nvidia/NVIDIAExternalCareerSite/jobs
  body: {appliedFacets: {}, limit: 20, offset: 0, searchText: ""}
  probe:
    kind: json
    items: jobPostings
    title: title
    date: postedOn
    count: total
    fields: {location: locationsText, posted: postedOn, path: externalPath}
  notes: list dates are relative ("Posted Today"); the job's own page has the ISO startDate

# ----------------------------------------------------------------- big companies' own careers APIs
- id: amazon
  name: Amazon (amazon.jobs)
  family: bigtech
  enabled: false
  url: https://www.amazon.jobs/en/search.json?result_limit=100&offset=0&sort=recent&country=USA
  probe:
    kind: json
    items: jobs
    title: title
    date: posted_date
    count: hits
    fields: {location: location, city: city, posted: posted_date, path: job_path}
  notes: "OFF (Alex, 2026-11-04): robots.txt allows it, but amazon.jobs links to Amazon's Conditions of Use, which
    forbid robots and data-gathering tools. Amazon's roles come through the community lists and LinkedIn alerts."

- id: microsoft
  name: Microsoft (careers pcsx API)
  family: bigtech
  url: https://apply.careers.microsoft.com/api/pcsx/search?domain=microsoft.com&query=&location=United%20States&start=0
  probe: {kind: json}
  notes: robots.txt explicitly allows /api/pcsx

- id: apple
  name: Apple (jobs.apple.com search API)
  family: bigtech
  enabled: false
  method: POST
  url: https://jobs.apple.com/api/v1/search
  body: {query: "", filters: {locations: [postLocation-USA]}, page: 1, locale: en-us, sort: newest}
  probe: {kind: json}
  notes: "OFF: undocumented, and with the site's filters it returned no results (2026-11-04). Apple's new-grad roles
    come through the community lists (57 active on Simplify) and LinkedIn alerts."

- id: google-careers
  name: Google Careers
  family: bigtech
  enabled: false
  notes: no API; results pages are disallowed by robots.txt. Covered by LinkedIn alerts and the miss-check.

- id: meta-careers
  name: Meta Careers
  family: bigtech
  enabled: false
  notes: robots.txt asks for express written permission for automated collection. Covered by LinkedIn alerts.

# --------------------------------------------------------------------------------------- job APIs
- id: adzuna
  name: Adzuna (US)
  family: api
  adapter: adzuna
  options: {endpoint: "https://api.adzuna.com/v1/api/jobs/us/search/{page}", max_pages: 2, max_days_old: 2,
            early_words: "graduate grad junior entry associate"}
  url: https://api.adzuna.com/v1/api/jobs/us/search/1?results_per_page=50&what=software%20engineer&max_days_old=1&content-type=application/json
  auth: {params: {app_id: ADZUNA_APP_ID, app_key: ADZUNA_APP_KEY}}
  probe:
    kind: json
    items: results
    title: title
    date: created
    count: count
    fields: {company: company.display_name, location: location.display_name, pay_min: salary_min, created: created,
             url: redirect_url}
  terms: personal job search is a permitted use; attribution ("Jobs by Adzuna") required

- id: usajobs
  name: USAJobs (federal)
  family: api
  adapter: usajobs
  headers: {User-Agent: "{contact}"}
  options: {endpoint: "https://data.usajobs.gov/api/search", places: ["Washington, DC"], date_posted: 3,
            hiring_paths: [graduates]}
  url: https://data.usajobs.gov/api/search?Keyword=software&DatePosted=1&ResultsPerPage=100
  auth: {headers: {Authorization-Key: USAJOBS_API_KEY}}
  probe:
    kind: json
    items: SearchResult.SearchResultItems
    title: MatchedObjectDescriptor.PositionTitle
    date: MatchedObjectDescriptor.PublicationStartDate
    count: SearchResult.SearchResultCountAll
    fields: {org: MatchedObjectDescriptor.OrganizationName, location: MatchedObjectDescriptor.PositionLocationDisplay,
             pay: MatchedObjectDescriptor.PositionRemuneration, url: MatchedObjectDescriptor.PositionURI}
  terms: User-Agent must be the email the key was registered with (DEBRIEF_CONTACT; sent by the collector)

- id: themuse
  name: The Muse
  family: api
  adapter: themuse
  options: {endpoint: "https://www.themuse.com/api/public/jobs", categories: [Software Engineering, Data and Analytics],
            level: Entry Level, max_pages: 5, page_size: 20, stop_days: 3}
  url: https://www.themuse.com/api/public/jobs?page=0&level=Entry%20Level&category=Software%20Engineering
  probe:
    kind: json
    items: results
    title: name
    date: publication_date
    count: total
    fields: {company: company.name, locations: locations, levels: levels, published: publication_date}
  terms: 500 requests an hour without a key

- id: himalayas
  name: Himalayas (remote)
  family: api
  adapter: himalayas
  options: {endpoint: "https://himalayas.app/jobs/api", max_pages: 15, page_size: 20, stop_days: 2}
  url: https://himalayas.app/jobs/api?limit=20&offset=0
  probe:
    kind: json
    items: jobs
    title: title
    date: pubDate
    fields: {company: companyName, location: locationRestrictions, pay_min: minSalary, published: pubDate,
             url: applicationLink}
  terms: attribution and link back; apply through applicationLink

- id: remoteok
  name: RemoteOK
  family: api
  adapter: remoteok
  url: https://remoteok.com/api
  probe:
    kind: json
    items: ""
    title: position
    date: date
    fields: {company: company, location: location, pay_min: salary_min, date: date, url: url}
  terms: link back to RemoteOK and mention it as the source; the first item is a legal notice

- id: weworkremotely
  name: We Work Remotely (RSS)
  family: api
  adapter: wwr_rss
  url: https://weworkremotely.com/remote-jobs.rss
  probe: {kind: feed}

- id: jobicy
  name: Jobicy (remote)
  family: api
  adapter: jobicy
  url: https://jobicy.com/api/v2/remote-jobs?count=50&geo=usa
  probe: {kind: json, items: jobs, title: jobTitle, date: pubDate, conditional: false,
          fields: {company: companyName, geo: jobGeo, level: jobLevel, pay_min: salaryMin, published: pubDate}}
  terms: poll at most once an hour; credit Jobicy with a link

- id: remotive
  name: Remotive (remote)
  family: api
  enabled: false
  url: https://remotive.com/api/remote-jobs?category=software-dev&limit=50
  probe:
    kind: json
    items: jobs
    title: title
    date: publication_date
    fields: {company: company_name, location: candidate_required_location, pay: salary, published: publication_date}
  terms: jobs appear 24 h late; at most 4 requests a day; attribution; don't resubmit to other boards
  notes: "OFF: remotive.com robots.txt has Disallow: /api/* for every User-Agent (checked 2026-11-04)"

# ------------------------------------------------------------------------- Hacker News (hiring)
- id: hn-whoishiring
  name: HN "Who is hiring?" (monthly)
  family: discussion
  adapter: hn_whoishiring
  url: https://hn.algolia.com/api/v1/search_by_date?tags=story,author_whoishiring&hitsPerPage=6
  probe: {kind: json, items: hits, title: title, date: created_at, fields: {id: objectID, comments: num_comments}}
  notes: free-text comments, one per company; the November thread is the newest

- id: hn-jobs
  name: HN job posts (YC companies)
  family: discussion
  adapter: hn_jobs
  options: {max_new: 40}
  url: https://hacker-news.firebaseio.com/v0/jobstories.json
  probe: {kind: json, items: ""}

# ----------------------------------------------------- the watchlist: the profile's companies (Revision 1)
- id: watchlist
  name: Watchlist boards (the profile's companies)
  family: watchlist
  adapter: watchlist
  options: {max_pages: 100}
  notes: each company's whole board, every night; Workday boards page 20 at a time (max_pages caps it at 2,000 jobs)

# ------------------------------------------------- descriptions for jobs that may be scored (M2)
- id: board-finder
  name: The company's own board, for jobs that came without a job-board id
  family: detail
  adapter: board_finder
  options:
    max_requests: 150
    retry_days: 14
    dead_days: 30
    exclude_companies: [Amazon, Google, Meta]
  notes: "runs just before describe. Only companies already in the board directory (guessing board names found 2 of
    103 jobs in the 2026-11-04 check); lists Greenhouse, Lever, Ashby, Workable and Recruitee boards, searches
    Workday by title; never SmartRecruiters (robots.txt). Amazon, Google and Meta stay OFF here too. The match is the
    merge rule's: same core title, overlapping place, exactly one job (src/debrief/jobs/adapters/finder.py)."

- id: describe
  name: Job descriptions from job-board APIs
  family: detail
  adapter: describe
  options: {max_requests: 300}
  notes: runs last; only open jobs that pass the profile's filters and have no description; Greenhouse, Lever and
    Workday per job, Ashby, Workable and Recruitee per board; never company sites or aggregators. A Greenhouse id
    from a company page (?gh_jid=) with no known board gets up to 4 guessed board names, proved by the API answering
    for that exact job; a found board goes in the directory

# ----------------------------------------------------------------------- the alert inbox (Gmail)
- id: alert-inbox
  name: Job-alert inbox (Gmail IMAP)
  family: email
  adapter: alert_inbox
  url: imaps://imap.gmail.com:993
  auth: {env: [JOBS_IMAP_USER, JOBS_IMAP_PASSWORD]}
  options: {early: true, days: 4, max_messages: 300}
  probe:
    kind: imap
    senders: {linkedin: linkedin.com, indeed: indeed.com, glassdoor: glassdoor.com, wellfound: wellfound.com,
              handshake: joinhandshake.com, dice: dice.com, builtin: builtin.com}
  notes: "a Gmail account used only for saved-search alerts (LinkedIn, Indeed, Handshake forwarded from the school
    address, Wellfound, Glassdoor, Dice, Built In; every search with the site's Entry-level filter, so the source
    counts as new-grad: options.early). Read-only: INBOX opened read-only, BODY.PEEK, nothing marked read or moved.
    The probe logs in and counts alert emails per sender, reading no bodies. Parsers per sender come from real
    samples (PLAN.md Revision 6); until then emails are kept and counted."

# --------------------------------------------------------- the miss-check sample (Google's job results)
- id: serpapi-account
  name: SerpAPI account (free; doesn't use a search)
  family: check
  url: https://serpapi.com/account.json
  auth: {params: {api_key: SERPAPI_KEY}}
  probe: {kind: json, items: null, single: true, title: plan_name,
          fields: {searches_left: total_searches_left, per_month: searches_per_month}}

- id: serpapi-google-jobs
  name: SerpAPI google_jobs (the coverage check's Google sample; the probe uses 1 free search)
  family: check
  adapter: serpapi_sample
  url: https://serpapi.com/search.json?engine=google_jobs&q=software%20engineer%20new%20grad&location=New%20York%2C%20New%20York%2C%20United%20States&hl=en&gl=us
  auth: {params: {api_key: SERPAPI_KEY}}
  options:
    endpoint: https://serpapi.com/search.json
    account_url: https://serpapi.com/account.json
    per_day: 8
    suffix: new grad
    locations:
      - {google: "New York, New York, United States"}
      - {google: "Washington, District of Columbia, United States"}
      - {google: "San Francisco, California, United States"}
      - {google: "United States", remote: true}
  notes: "never a source of jobs: `jobs coverage` reads these results back from the raw store. At most per_day
    searches, and never more than an even share of the month's searches left (read from account.json first,
    which doesn't use a search)."
  probe:
    kind: json
    items: jobs_results
    title: title
    date: detected_extensions.posted_at
    fields: {company: company_name, location: location, posted: detected_extensions.posted_at, via: via,
             apply: apply_options}

