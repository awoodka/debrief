# ----------------------------------------------------- the watchlist: the profile's companies (Revision 1)
- id: watchlist
  name: Watchlist boards (the profile's companies)
  family: watchlist
  adapter: watchlist
  options:
    max_pages: 100
    workday_search: [college, university, early career, associate, junior, jr]
    search_max_pages: 10
  notes: "each company's whole board, every night, except Workday boards: those are read through workday_search
    (Workday's searchText finds a job with every word of the search anywhere in its title or description), each
    search paged 20 jobs at a time up to search_max_pages. An empty workday_search reads every page (max_pages caps
    that at 2,000 jobs). A search read closes nothing: its jobs age out by max_age_days, and describe marks one gone
    on its own 404. Of the Workday jobs that passed the filters 2026-11-10 to 11-23 and that only the watchlist
    carried, the searches find 19 of 21 by title (the other 2 are NVIDIA internships), at an estimated 110 to 430
    requests a night against ~1,000 for every page. A level numeral can't be searched (Workday ignores the \"i\"
    of \"Software Engineer I\"); the 14 such RTX jobs that passed were all on new-grad lists too, 3 of them a day
    later (checked 2026-11-23)"

- id: yc-boards
  name: YC companies' boards (named in HN titles)
  family: watchlist
  adapter: yc_boards
  options: {search: "https://hn.algolia.com/api/v1/search_by_date", since: 2021-01-01, refresh_days: 7, max_pages: 100, startup: true}
  terms: "ycombinator.com and workatastartup.com forbid robots and scraping in their terms; Alex lifted the robots and
    terms rule on 2026-11-23, and waas-jobs now reads Work at a Startup. This source still takes its company list
    from HN story and job-post titles through the HN Algolia API, and the jobs from each company's own board"
  notes: "every YC company in an HN title since `since` (Launch HN, Show HN, \"is hiring\", HN job posts), refreshed
    weekly; matched to the boards its posts link to and the directory's boards whose id spells its name; watchlist
    companies and SmartRecruiters boards left out (src/debrief/jobs/adapters/yc.py). Only confirmed boards are read
    (a post links it, or its jobs' text named Y Combinator on its first read); a board that answered 404 waits for the
    weekly refresh. Normal filters, no watchlist treatment; data.yc is the batch"

# ------------------------------------------------- descriptions for jobs that may be scored (M2)
- id: board-finder
  name: The company's own board, for jobs that came without a job-board id
  family: detail
  adapter: board_finder
  options:
    max_requests: 150
    retry_days: 14
    dead_days: 30
    exclude_companies: [Amazon, Google, Meta]
  notes: "runs just before describe. Only companies already in the board directory (guessing board names found 2 of
    103 jobs in the 2026-11-04 check); lists Greenhouse, Lever, Ashby, Workable and Recruitee boards and the first
    page of a SmartRecruiters board, searches Workday by title. Amazon (its own source), Google and Meta have no
    job board to find. The match is the merge rule's: same core title, overlapping place, exactly one job
    (src/debrief/jobs/adapters/finder.py)."

- id: describe
  name: Job descriptions from job-board APIs
  family: detail
  adapter: describe
  options: {max_requests: 300, max_pages: {jobright: 60, linkedin: 40}}
  notes: "runs last; only open jobs not yet shown that pass the profile's filters and have no description, the ones
    that can still make tonight's list first; Greenhouse, Lever, SmartRecruiters and Workday per job, Ashby,
    Workable and Recruitee per board; never company sites. A Greenhouse id from a company page (?gh_jid=) with no
    known board gets up to 4 guessed board names, proved by the API answering for that exact job; a found board
    goes in the directory. A job no board reaches gets the page a listing links to, tried in order: jobright,
    LinkedIn's guest job page (the alert emails' links); at most max_pages[site] a night, outside max_requests,
    stored as the description and job criteria only, never the people the page names. A host that blocks us is
    asked nothing more that night. LinkedIn read 15 of 15 test pages (2026-11-23)."

# ----------------------------------------------------------------------- the alert inbox (Gmail)
- id: alert-inbox
  name: Job-alert inbox (Gmail IMAP)
  family: email
  adapter: alert_inbox
  url: imaps://imap.gmail.com:993
  auth: {env: [JOBS_IMAP_USER, JOBS_IMAP_PASSWORD]}
  options: {days: 4, max_messages: 300}
  probe:
    kind: imap
    senders: {linkedin: linkedin.com, indeed: indeed.com, glassdoor: glassdoor.com, wellfound: wellfound.com,
              handshake: joinhandshake.com, dice: dice.com, builtin: builtin.com}
  notes: "a Gmail account used only for saved-search alerts (LinkedIn, Indeed, Handshake forwarded from the school
    address, Wellfound, Glassdoor, Dice, Built In). Not a new-grad source (no options.early): most searches have no
    entry-level filter (16 of 19 on Indeed, every LinkedIn one; checked 2026-11-22). Read-only: INBOX opened
    read-only, BODY.PEEK, nothing marked read or moved. The probe logs in and counts alert emails per sender,
    reading no bodies. Indeed and LinkedIn digests are parsed (adapters/alerts.py); the other senders' emails are
    kept and counted."

# --------------------------------------------------------- the miss-check sample (Google's job results)
- id: serpapi-account
  name: SerpAPI account (free; doesn't use a search)
  family: check
  url: https://serpapi.com/account.json
  auth: {params: {api_key: SERPAPI_KEY}}
  probe: {kind: json, items: null, single: true, title: plan_name,
          fields: {searches_left: total_searches_left, per_month: searches_per_month}}

- id: serpapi-google-jobs
  name: SerpAPI google_jobs (the coverage check's Google sample; the probe uses 1 free search)
  family: check
  adapter: serpapi_sample
  url: https://serpapi.com/search.json?engine=google_jobs&q=software%20engineer%20new%20grad&location=New%20York%2C%20New%20York%2C%20United%20States&hl=en&gl=us
  auth: {params: {api_key: SERPAPI_KEY}}
  options:
    endpoint: https://serpapi.com/search.json
    account_url: https://serpapi.com/account.json
    per_day: 8
    suffix: new grad
    locations:
      - {google: "New York, New York, United States"}
      - {google: "Washington, District of Columbia, United States"}
      - {google: "San Francisco, California, United States"}
      - {google: "Boston, Massachusetts, United States"}
      - {google: "Austin, Texas, United States"}
      - {google: "United States", remote: true}
  notes: "never a source of jobs: `jobs coverage` reads these results back from the raw store. At most per_day
    searches, and never more than an even share of the month's searches left (read from account.json first,
    which doesn't use a search)."
  probe:
    kind: json
    items: jobs_results
    title: title
    date: detected_extensions.posted_at
    fields: {company: company_name, location: location, posted: detected_extensions.posted_at, via: via,
             apply: apply_options}

