# Jobs sources. One entry per source; `debrief jobs probe-sources` checks each one live and writes
# docs/jobs/SOURCES.md. Field reference:
#
#   id, name    stable id and display name
#   family      list | board | bigtech | api | discussion | email | check | universe | watchlist
#                 list      community-kept job lists (GitHub)
#                 board     one company's job board on a job-board system (an example of that system;
#                           the universe test covers the rest)
#                 bigtech   a big company's own careers API
#                 api       a job API (aggregator or job board with an official API)
#                 discussion  Hacker News hiring threads and job posts
#                 email     the alert inbox (LinkedIn, Indeed, ... alert emails)
#                 check     the miss-check sample (never a source of jobs)
#                 universe  a list of companies' job boards: the board directory, for finding a watchlist
#                           company's board (never polled as a whole; Revision 1)
#                 watchlist the profile's companies' boards, read in full every night
#   url, each   the endpoint; {each} expands over `each`
#   method      GET (default) or POST, with `body` as JSON
#   candidates  alternative urls, tried in order until one works
#   probe       how the probe parses it: kind json | feed | md_table | csv | text | imap
#                 items/title/date/count: dotted paths (json); `fields`: {name: dotted path} whose fill
#                 rate across items the probe reports
#   auth        {headers: {Header: ENV_VAR}, params: {param: ENV_VAR}}: sent when every var is set,
#               else the source is "needs_key" and nothing is requested
#   adapter     the collector that reads it nightly (src/debrief/jobs/adapters); none = probe only
#   options     the collector's settings (endpoint, when it differs from the probe's url; paging; searches)
#   headers     extra request headers; "{contact}" is DEBRIEF_CONTACT
#   terms       what the source's terms ask of us (attribution, rate)
#   enabled     false = listed with its reason, never requested

# ------------------------------------------------------------------ community lists (GitHub, JSON)
- id: simplify-newgrad
  name: SimplifyJobs New-Grad-Positions
  family: list
  adapter: simplify_json
  url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
  probe:
    kind: json
    items: ""
    title: title
    date: date_posted
    fields: {company: company_name, locations: locations, url: url, active: active, date_posted: date_posted,
             date_updated: date_updated, sponsorship: sponsorship, category: category, degrees: degrees}
  notes: updated about every 30 min; no LICENSE file in the repo

- id: vanshb03-newgrad
  name: vanshb03 New-Grad-2027
  family: list
  adapter: simplify_json
  url: https://raw.githubusercontent.com/vanshb03/New-Grad-2027/dev/.github/scripts/listings.json
  probe:
    kind: json
    items: ""
    title: title
    date: date_posted
    fields: {company: company_name, locations: locations, url: url, active: active, date_posted: date_posted}
  notes: urls are go.vansh.nyc short links

- id: speedyapply-ai
  name: speedyapply 2027-AI-College-Jobs (US new grad)
  family: list
  adapter: md_table
  url: https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/NEW_GRAD_USA.md
  probe: {kind: md_table}
  notes: markdown only (no JSON)

- id: speedyapply-swe
  name: speedyapply 2027-SWE-College-Jobs (US new grad)
  family: list
  adapter: md_table
  url: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/NEW_GRAD_USA.md
  probe: {kind: md_table}
  notes: markdown only (no JSON)

- id: jobright-newgrad
  name: jobright-ai 2026 new-grad lists
  family: list
  adapter: md_table
  url: https://raw.githubusercontent.com/jobright-ai/{each}/master/README.md
  each: [2026-Software-Engineer-New-Grad, 2026-Data-Analysis-New-Grad, 2026-Product-Management-New-Grad]
