# ------------------------------------------------------- job sites' own searches (Revision 10)
- id: linkedin-search
  name: LinkedIn job search (guest, posted in the last day)
  family: api
  adapter: linkedin_search
  url: https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search?keywords=software%20engineer%20junior&location=Washington%20DC-Baltimore%20Area&f_TPR=r86400&start=0
  options:
    endpoint: https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search
    posted: r86400
    max_requests: 50
    max_pages: 3
    us_wide: [founding engineer, forward deployed engineer]
    by_place:
      - 'software engineer (junior OR "new grad" OR "entry level" OR graduate OR "early career" OR associate)'
      - '(data OR "machine learning" OR AI OR "forward deployed") (junior OR "new grad" OR "entry level" OR graduate OR "early career" OR associate)'
    places: [Washington DC-Baltimore Area, New York City Metropolitan Area, San Francisco Bay Area, Greater Boston,
             "Austin, Texas Metropolitan Area", remote]
  probe: {kind: html, items: 'data-entity-urn="urn:li:jobPosting:', title: 'base-search-card__title">\s*([^<]+?)\s*</h3>'}
  notes: "ON 2026-11-23. The logged-out jobs page's search, jobs posted in the last day: us_wide
    keywords across the US (founding and forward deployed roles), then each by_place keyword in each place, at
    most max_pages pages of 10 and max_requests a night (14 searches x 3 pages = 42). The place keywords ask for
    early-career words: LinkedIn's entry-level filter is loose (0 of 15 jobs it returned said Entry level on their
    own page) and a card has no description, so only a title that says new grad, junior or associate passes the
    level check (6 passing cards in 4 pages with the words, 2 in the same 4 pages without; 2026-11-23). Items are
    keyed linkedin:<id> like the alert emails', link https://www.linkedin.com/jobs/view/<id> with no tracking ids;
    describe reads their job pages. Shares the linkedin.com rate bucket (5 s) and the block rule with describe: a
    429, 999 or login wall ends LinkedIn for the night."

- id: getro
  name: VC portfolio job boards on Getro (General Catalyst, Accel, Revolution, ...)
  family: api
  adapter: getro
  method: POST
  url: https://api.getro.com/api/v2/collections/222/search/jobs
  body: {hitsPerPage: 20, page: 0, query: "", filters: {job_functions: [Software Engineering, Data Science]}}
  headers: {Accept: application/json}                  # anything else answers 406
  options:
    endpoint: "https://api.getro.com/api/v2/collections/{network}/search/jobs"
    job_functions: [Software Engineering, Data Science]
    first_pages: 3
    max_pages: 10
    networks: {General Catalyst: 222, Accel: 8672, Khosla: 257, 8VC: 1005, Insight: 246, Menlo: 767, Techstars: 89,
               Revolution: 143, Lux: 103, Thrive: 2105}
  probe:
    kind: json
    items: results.jobs
    title: title
    date: created_at
    count: results.count
    fields: {company: organization.name, locations: locations, url: url, seniority: seniority, stage: organization.stage,
             head_count: organization.head_count, work_mode: work_mode}
  notes: "ON 2026-11-23. One public API behind ten VC funds' job boards (network ids from each board
    page's __NEXT_DATA__ props.pageProps.network.id; Revolution is a DC fund). Per fund, software and data jobs newest
    first until the newest job this source already has from that fund (first night: first_pages pages). Getro's job
    ids are global, so a job two funds list is one listing; links are the employer's own job pages. Each job carries
    the company's funding stage and head-count bucket (company_size), shown to the scoring call as a startup sign.
    Acquired companies keep their old names and a stage can be stale (Gusto shows series_a; checked 2026-11-23)."

- id: waas-jobs
  name: Work at a Startup (YC) job pages, by id
  family: api
  adapter: waas_jobs
  url: https://www.workatastartup.com/jobs
  headers: {Accept: text/html}                         # the default */* answers 406 (2026-11-23)
  options: {seed: {id: 124490, date: 2026-11-23}, ids_per_day: 150, first_days: 1, stop_after: 60, max_requests: 400, startup: true}
  probe: {kind: html, items: 'data-page="', title: '&quot;title&quot;:&quot;(.*?)&quot;'}
  notes: "ON 2026-11-23. YC startups' jobs, most of them on no job board we read. The job list needs a
    YC account, but each job's page is public and ids rise with time (about 180-200 a day; 55 of 300 walked ids were
    live jobs, in clusters, with runs of up to 42 misses between; 2026-11-23), so each night walks up from the
    highest id this source holds and stops after stop_after misses in a row past the highest job id the pages it
    read link to. Its first night starts first_days back from an estimate made from the seed (a job id live that
    day) at ids_per_day (set low, so it starts in the past, never ahead of the newest job), and max_requests carries
    the rest to the next night: about 260 a night at 1 s, 400 at most. A page has no date: first seen is the posted
    date. minExperience ('Any (new grads ok)') is the job's level. The raw store keeps the job, the company's name,
    batch and size and the description without the founders' names, emails or profile links; never the founders.
    A login redirect or a page without job data is a block."

