# ---------------------------------------------------------------------------------------- papers
- id: arxiv-rss
  name: arXiv category RSS
  adapter: arxiv_rss
  roles: [anchor]
  tier: 2
  kind: paper
  url: https://rss.arxiv.org/rss/{each}
  each: [cs.LG, cs.CL, cs.AI, cs.CV, stat.ML]
  probe: {kind: feed}
  notes: holds only the latest announcement; gaps are backfilled from arxiv-oai

- id: arxiv-api
  name: arXiv query API (lookups by id)
  adapter: arxiv_api
  roles: [context]
  tier: 2
  enabled: false
  url: https://export.arxiv.org/api/query?id_list=1706.03762
  probe: {kind: feed}
  notes: 'not needed: export.arxiv.org robots.txt is Disallow / for all agents, and arxiv-oai GetRecord does the same lookups (verified 2026-10-22)'

- id: arxiv-oai
  name: arXiv OAI-PMH (gap backfill and lookups by id)
  adapter: arxiv_oai
  roles: [context]
  tier: 2
  url: https://oaipmh.arxiv.org/oai?verb=Identify
  probe: {kind: status, expect: [200], contains: '<Identify>'}
  notes: 'verified 2026-10-22. Backfill: ListRecords set=cs / set=stat from=<cursor>. Lookup: GetRecord identifier=oai:arXiv.org:<id> metadataPrefix=arXiv. Same 3 s budget as all arXiv'

- id: hf-daily-papers
  name: Hugging Face Daily Papers
  adapter: hf_daily_papers
  roles: [anchor, discussion]
  tier: 1
  kind: paper
  url: https://huggingface.co/api/daily_papers
  probe: {kind: json, items: '', title: paper.title, date: publishedAt}

- id: hf-paper-detail
  name: Hugging Face paper page API (per paper)
  adapter: hf_daily_papers
  roles: [context]
  tier: 2
  url: https://huggingface.co/api/papers/2501.12948
  probe: {kind: json, single: true, title: title}
  notes: sample paper 2501.12948; checks which fields carry comments and upvotes

- id: hf-paper-comments
  name: Hugging Face paper comments
  roles: [discussion]
  tier: 3
  adapter: hf_paper_page
  url: https://huggingface.co/papers/2501.12948
  probe: {kind: status, expect: [200], contains: '&quot;comments&quot;:['}
  notes: no comments API (/api/papers/{id}/comments is 404). Comments are in the page's embedded JSON; daily_papers gives numComments, so only pages with comments get fetched

- id: hf-trending-papers
  name: Hugging Face trending papers
  adapter: hf_trending_papers
  roles: [anchor]
  tier: 2
  kind: paper
  url: https://huggingface.co/api/daily_papers?sort=trending
  probe: {kind: json, items: '', title: paper.title}
  notes: verified; returns a different order from the default list

- id: alphaxiv-overview
  name: alphaXiv overviews
  adapter: alphaxiv
  roles: [discussion, context]
  tier: 3
  url: https://alphaxiv.org/abs/2501.12948.md
  probe: {kind: status, expect: [200, 404]}
  notes: verify; 404 means no overview yet. Comments are not probed (no documented endpoint)

- id: semantic-scholar
  name: Semantic Scholar API
  adapter: semantic_scholar
  roles: [context]
  tier: 2
  url: https://api.semanticscholar.org/graph/v1/paper/ARXIV:1706.03762?fields=title,citationCount,influentialCitationCount
  probe: {kind: json, single: true, title: title}
  auth: {env: SEMANTIC_SCHOLAR_API_KEY, header: x-api-key, format: '{}'}
  notes: keyless shared pool answered 429; needs a free API key (SEMANTIC_SCHOLAR_API_KEY)

- id: openalex
  name: OpenAlex API
