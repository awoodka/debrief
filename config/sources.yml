  auth: {env: GITHUB_PAT, header: Authorization, format: 'Bearer {}'}
  notes: GitHub robots.txt disallows /*.atom$, so releases come from the REST API (60/h without GITHUB_PAT, 5000/h with). Repo list is a starting point for you to edit

