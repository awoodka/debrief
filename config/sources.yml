# Debrief v2 sources. One entry per source; adding a source is one entry here (plus an adapter, if
# its adapter type is new). Field reference: docs/v2/README.md. Quick version:
#
#   id, name     stable id (used in raw paths and the index) and a display name
#   adapter      the adapter type that will fetch it (M1+); probe-sources ignores this
#   roles        anchor | discussion | reference | context  (a list: a source can hold two roles)
#   tier         1 always considered · 2 filtered normally · 3 attach-only (never an anchor)
#   kind, org    default story kind and organisation for anchors from this source
#   url, each    the endpoint; {each} expands over the `each` list. Dates: {today} {yesterday} {since_24h}
#   candidates   unverified alternatives, tried in order by probe-sources (string, or {url, probe})
#   probe        how probe-sources checks it: kind feed | links | json | graphql | status | itunes
#   auth         {env, header, format}: send a header when that env var is set
#   enabled      false = ships disabled (optional adapters)
#
# "verify" in notes = not yet confirmed live; docs/v2/SOURCES.md has the probe results.

