# Debrief v2 settings. Sources live in sources.yml; secrets live in .env (never here).

# {contact} is DEBRIEF_CONTACT, or contact_default when that's unset. Some APIs (SEC EDGAR) require
# an email address here, so set DEBRIEF_CONTACT to one before enabling those sources.
user_agent: "debrief/2.0 (personal AI/ML news digest; {contact})"
contact_default: "+https://github.com/awoodka/debrief"

http:
  timeout_s: 30
  max_retries: 2
  backoff_s: 5               # first retry after 5 s, then 10 s
  max_retry_after_s: 120     # a server asking for a longer pause fails the fetch instead of stalling the run
  default_interval_s: 2.0    # per host, when no bucket below matches
  # Rate buckets: one request at a time, at least interval_s apart, across every listed host and its
  # subdomains.
  buckets:
    arxiv:
      # arXiv terms of use (checked 2026-10-22): at most one request every 3 s, on a single
      # connection, across ALL machines under our control. The v1 collector on this server shares
      # this budget, so never run v2 against arXiv during the v1 window (08:30-09:10 ET).
      hosts: [arxiv.org]
      interval_s: 3.5
    deepmind:
      hosts: [deepmind.google]   # reported to rate-limit
      interval_s: 10
    sec:
      hosts: [sec.gov]           # SEC fair access: <= 10 requests/s, declared UA with an email
      interval_s: 0.5
    huggingface-pages:
      # HF advertises (RateLimit-Policy, 2026-10-22): pages 100 per 300 s, API 500 per 300 s.
      hosts: [huggingface.co/papers, huggingface.co/blog, huggingface.co/spaces]
      interval_s: 3.5
    huggingface:
      hosts: [huggingface.co]
      interval_s: 1.0
    openreview:
      hosts: [api2.openreview.net]   # advertises 20 per 60 s
      interval_s: 3.5
    github-api:
      hosts: [api.github.com]
      interval_s: 1.0
    github:
      hosts: [github.com]
      interval_s: 1.0
    hn:
      hosts: [hn.algolia.com]
      interval_s: 1.0
    venturebeat:
      hosts: [venturebeat.com]
      interval_s: 10

collect:
  # Anchors from windowed sources (feeds, release lists, listing pages) whose publish date is older
  # than this when first seen are recorded as seen, not made into stories. This is a bootstrap
  # guard, not a cursor: the seen-set is the cursor.
  window_days: 7
  title_max_chars: 300
  summary_max_chars: 1500
  max_authors: 15
  raw_retention_days: 60
  listing:
    bootstrap_fetch: 5          # first run: fetch this many of the newest links, record the rest as seen
    max_new_per_run: 15
  hf_daily_papers:
    bootstrap_days: 3
    lookback_days: 4            # re-read this many days every run, so upvotes and comments stay current
    limit: 100                  # the API defaults to 50 a day; 64 were listed on 2026-10-21
  hf_papers:
    lookback_days: 3            # the paper pool: papers HF listed, first seen this many days back (CRITERIA.md)
  paper_use_bar:                # evidence of use (CRITERIA.md): one of these
    min_artifacts: 1            # models + datasets + Spaces on the Hub that link the paper
    min_stars: 100              # the official repo's GitHub stars
  hn:
    slice_hours: 6              # one request per slice (~400 stories per 6 h on 2026-10-22; the API returns up to 1000)
    overlap_minutes: 60         # re-read the last hour each run; Algolia indexes some stories late
    bootstrap_hours: 24         # how far back a first run reaches (bootstrap-bands reaches further)
    refresh_days: 3             # re-read points and comments of attached threads posted this recently
  hn_comments:
    thread_source: hn
    days: 3                     # threads posted this recently
    min_comments: 5
    max_threads: 40             # per run
    regrow: 1.5                 # re-read a tree once its comment count has grown this many times
    top_ranked: 8               # top-level comments kept, in HN's ranked order
    top_replied: 3              # plus this many of the most-replied others, so disagreement survives
    comment_max_chars: 1200
  hf_paper_comments:
    # Automated accounts that comment on many papers (link lists, related-paper bots); not discussion.
    skip_authors: [librarian-bot, researchstudio-bot]
    skip_author_pattern: '(^|[-_])bot$'
  hf_trending:
    max_age_days: 14            # a trending model counts as a release only if it's this new

# Story kind -> index section.
sections:
  paper: papers
  release: releases
  repo: releases
  leaderboard: releases
  announcement: announcements
  press: press_policy
  policy: press_policy
  incident: press_policy
  discussion: discussion

# Attaching mentions to stories (stories/attach.py).
attach:
  title_days: 3                 # stories first seen this recently can take new posts by name or title; older ones never reach the index
  title_min_jaccard: 0.6        # conservative on purpose; the model's same_as pass (M4) covers the rest
  title_min_shared: 4
  retro_days: 7                 # the end-of-run pass retries unattached posts this recent; longer than title_days on purpose,
                                # so a story noticed late still finds discussion that started before it (DeepSeek V4.1 Flash: 5 days)

# Discussion level and trend (stories/signals.py has the exact rules).
bands:
  window_days: 7                 # a weekly cycle (~960 HN threads above the floor); 3 days would leave ~20 above the 95th
  min_observations: 200         # a source needs this many threads in the window before percentiles mean anything
  # Only threads with at least this many points count toward a source's distribution. Most HN
  # submissions die at 1-3 points: on 2026-10-22 the 75th percentile over all of them was 4 points,
  # so every attached thread looked notable. With a floor of 10 (~138 threads a day) it's 140 points,
  # and the 95th is 525. Threads below the floor still count toward "some".
  floor:
    hn: 10
  notable_pctl: 75
  heavy_pctl: 95
trend:
  rising_ratio: 1.5
  falling_ratio: 0.5
  min_growth: 10                # points + comments; smaller moves are noise (a 3 -> 5 -> 5 thread isn't "falling")
