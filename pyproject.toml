[project]
name = "debrief"
version = "2.0.0.dev0"
description = "Debrief: a daily AI/ML briefing (collector, triage, the brief and its page)"
requires-python = ">=3.13"
# Exact pins for the image live in deploy/requirements.lock; these are the direct dependencies.
dependencies = ["requests", "feedparser", "PyYAML", "beautifulsoup4", "trafilatura", "jsonschema", "python-dotenv"]

[project.scripts]
debrief = "debrief.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
