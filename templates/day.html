<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>$title</title>
<style>
  /* v1's page (dashboard/debrief.template.html on main): the same tokens and type, minus the parts
     v2 doesn't have, plus the headline, quotes, thread chips, updates and the scan's section labels. */
  :root{
    --paper:#faf7f1; --surface:#fffdf8; --raise:#f5efe4;
    --ink:#221d16; --body:#332d24; --muted:#6f6656; --faint:#9a917f;
    --accent:#b0472a; --accent-ink:#8f3a21; --accent-soft:#f3e7df;
    --bull:#436a3c; --bull-bg:#eef3e6; --bull-br:#cfe0bf;
    --bear:#a23f2a; --bear-bg:#f7e9e2; --bear-br:#eccabb;
    --rule:#e7ddcd; --hair:#efe7d8;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#1a1611; --surface:#221d16; --raise:#2a241b;
      --ink:#efe6d6; --body:#ddd3c2; --muted:#a99f8c; --faint:#7c7362;
      --accent:#e5825a; --accent-ink:#f0a184; --accent-soft:#37281f;
      --bull:#8fb87f; --bull-bg:#22301c; --bull-br:#3c5231;
      --bear:#e0917a; --bear-bg:#331f18; --bear-br:#5a3527;
      --rule:#342c20; --hair:#2e271d;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--body); font-family:var(--serif);
    font-size:19px; line-height:1.66; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .wrap{max-width:720px; margin:0 auto; padding:60px 30px 120px}
  ::selection{background:var(--accent-soft)}
  a{color:inherit; text-decoration-color:var(--rule); text-underline-offset:2px}
  a:hover{color:var(--accent); text-decoration-color:var(--accent)}

  a.back{display:inline-block; font-family:var(--sans); font-size:13px; letter-spacing:.02em; color:var(--accent);
         text-decoration:none; margin-bottom:22px}

  /* ---- masthead ---- */
  header.top{border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:8px}
  .brandrow{display:flex; align-items:baseline; justify-content:space-between; gap:16px}
  .wordmark{font-family:var(--sans); font-weight:800; letter-spacing:.28em; font-size:14px; color:var(--accent); text-transform:uppercase}
  .rundate{font-family:var(--sans); font-size:12.5px; color:var(--muted); letter-spacing:.02em; font-variant-numeric:tabular-nums; text-align:right}
  h1.headline{font-size:30px; line-height:1.22; letter-spacing:-.018em; margin:14px 0 0; color:var(--ink); font-weight:600}

  /* ---- section kickers ---- */
  .kicker{font-family:var(--sans); font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
          color:var(--accent); margin:0 0 14px}

  /* ---- what happened (top scan) ---- */
  section.scan{margin:34px 0 40px}
  ul.wh{list-style:none; margin:0; padding:0; font-family:var(--sans)}
  ul.wh li{position:relative; padding:11px 0 11px 30px; border-top:1px solid var(--hair); font-size:16px; line-height:1.5; color:var(--ink)}
  ul.wh li:first-child{border-top:0}
  ul.wh li::before{content:"→"; position:absolute; left:2px; top:11px; color:var(--accent); font-weight:700}

  /* ---- lead ---- */
  section.lead{margin:0 0 20px}
  .lead p{margin:0 0 18px; font-size:20.5px; line-height:1.62; color:var(--ink)}
  .lead p:first-of-type{font-size:22px}
  .lead p:first-of-type::first-letter{
    float:left; font-size:62px; line-height:.82; padding:6px 10px 0 0; color:var(--accent); font-weight:600;
  }
  hr.div{border:0; border-top:1px solid var(--rule); margin:40px 0}

  /* ---- the article's sections ---- */
  .theme{margin:0 0 40px}
  .theme h2{font-size:26px; line-height:1.22; letter-spacing:-.015em; margin:0 0 12px; color:var(--ink); font-weight:600}
  .theme p{margin:0 0 16px; color:var(--body)}

  /* for / against / my read */
  .split{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:18px 0 12px}
  .pane{border-radius:10px; padding:15px 17px; font-family:var(--sans); font-size:15px; line-height:1.55}
  .pane .tag{display:block; font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; margin-bottom:6px}
  .pane.bull{background:var(--bull-bg); border:1px solid var(--bull-br)} .pane.bull .tag{color:var(--bull)}
  .pane.bear{background:var(--bear-bg); border:1px solid var(--bear-br)} .pane.bear .tag{color:var(--bear)}
  .myread{margin:12px 0 16px; padding:13px 17px; border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 9px 9px 0}
  .myread .tag{display:block; font-family:var(--sans); font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:4px}
  .myread .rd{font-family:var(--sans); font-size:15px; line-height:1.55; color:var(--ink)}

  /* quotes */
  blockquote.q{margin:20px 0; padding:4px 0 4px 22px; border-left:3px solid var(--accent)}
  blockquote.q p{margin:0; font-size:20px; line-height:1.45; font-style:italic; color:var(--ink)}
  blockquote.q .who{display:block; margin-top:6px; font-family:var(--sans); font-size:13px; font-style:normal; color:var(--muted)}

  /* sources line */
  .refs{margin-top:16px; font-family:var(--sans); font-size:13.5px; line-height:1.7; color:var(--muted)}
  .refs .rtag{display:block; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--faint)}
  .refs .src{display:block}
  .chip{font-family:var(--sans); font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:999px; background:var(--raise);
        color:var(--muted); white-space:nowrap; text-decoration:none; margin-left:4px}
  a.chip:hover{color:var(--accent)}

  /* ---- updates and notes ---- */
  section.updates, section.notes{margin:44px 0 0}
  .upd{border-top:1px solid var(--hair); padding:14px 0}
  .upd:first-of-type{border-top:0; padding-top:0}
  .upd .ut{font-family:var(--sans); font-size:15px; font-weight:640; color:var(--ink)}
  .upd .since{font-weight:400; font-size:13px; color:var(--faint); margin-left:6px}
  .upd p{margin:6px 0 0; font-size:17px}
  section.notes ul{margin:0; padding-left:20px; font-family:var(--sans); font-size:15px; line-height:1.55; color:var(--muted)}
  .notice{margin:34px 0 0; padding:16px 18px; border-radius:10px; background:var(--accent-soft); font-family:var(--sans);
          font-size:15px; line-height:1.55; color:var(--ink)}
  .notice p{margin:0}

  /* ---- the scan (bottom): every story kept ---- */
  section.index{margin:52px 0 0; border-top:2px solid var(--ink); padding-top:22px}
  .ixsec{font-family:var(--sans); font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
         color:var(--faint); margin:26px 0 4px}
  .ix{font-family:var(--sans); border-top:1px solid var(--hair); padding:11px 0; line-height:1.4}
  .ixsec + .ix{border-top:0}
  .ix .t{font-weight:640; color:var(--ink); font-size:15px; text-decoration:none}
  .ix .t:hover{color:var(--accent)}
  .ix .n{display:block; color:var(--muted); font-size:14.5px; line-height:1.45; margin-top:2px}
  .ix .in{font-size:12px; font-weight:600; color:var(--accent); text-decoration:none; margin-left:8px; white-space:nowrap}

  /* ---- footer ---- */
  footer.foot{margin-top:50px; padding-top:18px; border-top:1px solid var(--rule);
    font-family:var(--sans); font-size:12.5px; line-height:1.6; color:var(--faint)}
  footer.foot div{margin-bottom:6px}
  footer.foot b{font-weight:700; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-size:10.5px; margin-right:4px}

  @media (max-width:620px){
    .wrap{padding:38px 20px 84px}
    body{font-size:18px}
    h1.headline{font-size:25px}
    .lead p, .lead p:first-of-type{font-size:19px}
    .theme h2{font-size:22px}
    blockquote.q p{font-size:18px}
    .split{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap"><main id="app">
$content
</main></div>
</body>
</html>
