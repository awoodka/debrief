<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Jobs{% endblock %}</title>
<style>
  /* Debrief's look (templates/day.html): the same tokens, light and dark. */
  :root{
    --paper:#faf7f1; --surface:#fffdf8; --raise:#f5efe4;
    --ink:#221d16; --body:#332d24; --muted:#6f6656; --faint:#9a917f;
    --accent:#b0472a; --accent-ink:#8f3a21; --accent-soft:#f3e7df;
    --good:#436a3c; --good-bg:#eef3e6; --warn:#a23f2a; --warn-bg:#f7e9e2;
    --rule:#e7ddcd; --hair:#efe7d8;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#1a1611; --surface:#221d16; --raise:#2a241b;
      --ink:#efe6d6; --body:#ddd3c2; --muted:#a99f8c; --faint:#7c7362;
      --accent:#e5825a; --accent-ink:#f0a184; --accent-soft:#37281f;
      --good:#8fb87f; --good-bg:#22301c; --warn:#e0917a; --warn-bg:#331f18;
      --rule:#342c20; --hair:#2e271d;
    }
  }
  :root{color-scheme:light dark; accent-color:var(--accent)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper); color:var(--body); font-family:var(--serif); font-size:17px; line-height:1.55;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px; margin:0 auto; padding:22px 18px 80px}
  a{color:inherit; text-decoration-color:var(--rule); text-underline-offset:2px}
  a:hover{color:var(--accent); text-decoration-color:var(--accent)}
  nav{font-family:var(--sans); font-size:14px; display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline;
      border-bottom:1px solid var(--rule); padding-bottom:10px; margin-bottom:22px}
  nav .brand{font-family:var(--serif); font-weight:700; color:var(--ink); font-size:19px; text-decoration:none; margin-right:6px}
  nav a{text-decoration:none; color:var(--muted)} nav a.on{color:var(--accent-ink); font-weight:600}
  nav .who{margin-left:auto; color:var(--faint); font-size:12px}
  h1{font-size:28px; color:var(--ink); margin:0 0 4px; line-height:1.2}
  h2{font-family:var(--sans); font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
     margin:30px 0 10px}
  .sub{font-family:var(--sans); color:var(--muted); font-size:14px; margin:0 0 6px}
  .job{background:var(--surface); border:1px solid var(--rule); border-left:4px solid var(--rule); border-radius:8px;
       padding:12px 14px; margin:10px 0}
  .job.tracked{border-color:var(--accent); border-left-color:var(--accent); background:var(--accent-soft)}
  .job h3{font-size:18px; margin:2px 0 2px; color:var(--ink); line-height:1.3}
  .job h3 a{text-decoration:none} .job h3 a:hover{text-decoration:underline}
  .meta{font-family:var(--sans); font-size:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .score{font-weight:700; color:var(--ink); background:var(--raise); border-radius:5px; padding:1px 7px}
  .bonus{color:var(--good); font-weight:600; margin-left:2px}
  .badge{border-radius:999px; padding:1px 8px; background:var(--accent); color:var(--paper); font-weight:600}
  .badge.warn{background:var(--warn-bg); color:var(--warn)} .badge.soft{background:var(--raise); color:var(--muted); font-weight:500}
  .co{font-family:var(--sans); font-size:14px; color:var(--muted); margin:0 0 4px}
  .why{margin:4px 0} .note,.miss,.also{font-family:var(--sans); font-size:13px; margin:3px 0}
  .note{color:var(--faint)} .miss{color:var(--warn)} .also{color:var(--muted)}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:8px}
  button,.btn{font-family:var(--sans); font-size:13px; border:1px solid var(--rule); background:var(--raise); color:var(--ink);
              border-radius:6px; padding:5px 12px; cursor:pointer; text-decoration:none}
  button.primary{background:var(--accent); border-color:var(--accent); color:var(--paper)}
  button:hover,.btn:hover{border-color:var(--accent)}
  input[type=text],input[type=url],select,textarea{font:14px var(--sans); color:var(--ink); background:var(--surface);
              border:1px solid var(--rule); border-radius:6px; padding:6px 8px}
  details{margin:18px 0} summary{font-family:var(--sans); font-size:14px; color:var(--muted); cursor:pointer}
  table{border-collapse:collapse; font-family:var(--sans); font-size:13px; width:100%}
  th,td{text-align:left; padding:5px 8px; border-bottom:1px solid var(--hair); vertical-align:top}
  th{color:var(--muted); font-weight:600}
  .msg{font-family:var(--sans); font-size:14px; background:var(--good-bg); color:var(--good); border-radius:6px; padding:8px 12px}
  .err{font-family:var(--sans); font-size:14px; background:var(--warn-bg); color:var(--warn); border-radius:6px; padding:8px 12px}
  .err ul{margin:4px 0 0; padding-left:18px}
  pre{font-family:var(--mono); font-size:12.5px; background:var(--surface); border:1px solid var(--rule); border-radius:6px;
      padding:10px; overflow:auto; white-space:pre-wrap}
  .add{color:var(--good)} .del{color:var(--warn)}
  .empty{font-family:var(--sans); color:var(--faint)}

  /* settings: a closed card for each section, with its current values showing */
  .set{display:block; background:var(--surface); border:1px solid var(--rule); border-left:4px solid var(--rule); border-radius:8px;
       margin:10px 0; scroll-margin-top:14px}
  .set:has(>details[open]){border-left-color:var(--accent)}
  .set.bad{border-left-color:var(--warn)}
  .set>details{margin:0}
  .set>details>summary,a.set.open{display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:14px; padding:10px 14px; list-style:none;
       color:inherit; text-decoration:none; cursor:pointer; border-radius:7px}
  .set>details>summary::-webkit-details-marker{display:none}
  .set>details>summary:hover h3,a.set.open:hover h3{color:var(--accent-ink)}
  .set h3{font-size:18px; line-height:1.3; margin:0; color:var(--ink); font-weight:700; grid-column:1}
  .now{font-family:var(--sans); font-size:13px; line-height:1.45; color:var(--muted); grid-column:1; margin-top:2px}
  .act{font-family:var(--sans); font-size:13px; color:var(--accent-ink); font-weight:600; grid-column:2; grid-row:1 / span 2; align-self:center}
  .act::before{content:"Edit"}
  .set>details[open]>summary .act::before{content:"Close"}
  .set>details[open]>summary .now{display:none}
  a.set.open .act::before{content:"Open"}
  .set .body{padding:0 14px 16px}

  /* a setting's words above its control; short controls share a line */
  .fields{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:16px 22px; align-items:start}
  .f{grid-column:span 6; min-width:0}
  .f-number{grid-column:span 2}
  .f-choice,.body>.fields>.f-text{grid-column:span 3}
  .f>label:not(.chk),.lab{display:block; font:600 13.5px/1.4 var(--sans); color:var(--ink); margin:0 0 4px}
  .hint{display:block; font:400 12.5px/1.45 var(--sans); color:var(--muted); margin:4px 0 0}
  .f input[type=text],.f select,.f textarea{width:100%; display:block; background:var(--paper); padding:7px 9px;
       border-color:color-mix(in srgb,var(--rule),var(--ink) 16%)}
  .f textarea{font-family:var(--sans); font-size:14px; line-height:1.5; min-height:4.5em; max-height:70vh; resize:vertical; field-sizing:content}
  .f textarea.area{font-family:var(--serif); font-size:15px; min-height:6.5em}
  .f input:focus,.f select:focus,.f textarea:focus,.savebar input:focus,.restore input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
  summary:focus-visible,a:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .unit{display:flex; align-items:center; gap:6px; font:14px var(--sans); color:var(--muted)}
  .f .unit input[type=text]{flex:0 1 6em; width:6em; min-width:0; font-variant-numeric:tabular-nums}
  .chk{display:flex; gap:10px; align-items:flex-start; font:600 14px/1.4 var(--sans); color:var(--ink); cursor:pointer}
  .chk input{width:18px; height:18px; margin:1px 0 0; flex:none}
  .chk .hint{margin-top:2px}
  .chk.quiet{grid-column:span 6; font-weight:400; color:var(--muted); font-size:13px}
  .chk.quiet input{width:16px; height:16px}

  /* a list of things: each row folds, with one spare to add another */
  .items{margin:8px 0 0}
  details.item{margin:6px 0; border:1px solid var(--hair); border-radius:6px; background:var(--paper)}
  details.item>summary{display:flex; flex-wrap:wrap; align-items:baseline; gap:0 8px; padding:8px 10px; font-size:14px; color:var(--ink); list-style:none; border-radius:5px}
  details.item>summary::-webkit-details-marker{display:none}
  details.item>summary::before{content:"\25B8"; color:var(--faint); font-size:12px; width:10px; flex:none}
  details.item[open]>summary::before{content:"\25BE"}
  details.item>summary b{font-weight:600}
  details.item>summary .ct{color:var(--faint); font-size:12.5px; min-width:0}
  details.item>summary .badge{margin-left:auto; font-size:12px}
  details.item.new{border-style:dashed; background:transparent}
  details.item.new>summary{color:var(--accent-ink); font-weight:600; font-size:13px}
  details.item.bad{border-color:var(--warn)}
  details.item>.in{padding:12px; border-top:1px solid var(--hair)}
  details.item .f input[type=text],details.item .f textarea{background:var(--surface)}
  details.adv{margin:18px 0 0; border-top:1px solid var(--hair); padding-top:12px}
  details.adv>summary{font-size:13.5px; font-weight:600; color:var(--muted)}
  details.adv>.fields{margin-top:14px}

  /* errors sit on the setting they belong to */
  .ferr{font:600 13px/1.4 var(--sans); color:var(--warn); margin:5px 0 0}
  .f.bad input[type=text],.f.bad textarea,.f.bad select{border-color:var(--warn); background:var(--warn-bg)}
  .f.bad>label:not(.chk),.f.bad>.lab{color:var(--warn)}
  .err a{color:inherit; text-decoration-color:currentColor}
  .err .again{margin:8px 0 0; font-size:13px}

  /* Save follows you down the page */
  .savebar{position:sticky; bottom:0; z-index:2; display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:var(--paper);
           border-top:1px solid var(--rule); margin:22px -18px 0; padding:10px 18px}
  .savebar input[type=text]{flex:1 1 240px; min-width:0; padding:7px 9px}
  .savebar button{padding:7px 14px; font-size:14px}
  .savebar button.primary{font-weight:600; min-width:84px}

  form.row input{flex:1 1 200px; min-width:0}
  .watch-edit .lab{display:none}
  .watch-edit .hint{margin-top:0}

  /* what changed */
  .chg{background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:12px 14px; margin:10px 0}
  .chg h3{font-size:17px; line-height:1.3; margin:0; color:var(--ink)}
  .chg dl,.ro{display:grid; grid-template-columns:minmax(120px,190px) minmax(0,1fr); gap:8px 14px; margin:8px 0 0; font:14px/1.5 var(--sans)}
  .chg dt,.ro dt{color:var(--muted); font-weight:600; font-size:13px; line-height:1.5}
  .chg dd,.ro dd{margin:0; color:var(--ink); min-width:0; overflow-wrap:anywhere}
  .ro dd{white-space:pre-line}
  .said{display:block; color:var(--muted); font-size:13px}
  .tag{display:inline-block; border-radius:5px; padding:0 7px; margin:1px 3px 1px 0; font-size:13px; line-height:1.6}
  .tag.add{background:var(--good-bg); color:var(--good)}
  .tag.del{background:var(--warn-bg); color:var(--warn)}
  .was{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--faint)}
  .is{font-weight:600; color:var(--ink)}
  .restore p{font:14px/1.5 var(--sans); margin:0 0 10px}
  .restore .row{margin-top:0}
  .restore .row input[type=text]{flex:1 1 240px; min-width:0; padding:7px 9px}
  .restore .chg{background:var(--paper)}
  .vnav{font:13px var(--sans); color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 14px; margin:2px 0 0}
  .everything h3{font-size:16px; color:var(--ink); margin:16px 0 0}

  /* versions */
  .vers{background:var(--surface); border:1px solid var(--rule); border-radius:8px}
  .vlist{list-style:none; margin:0; padding:0; font:14px/1.45 var(--sans)}
  .vlist li{display:grid; grid-template-columns:92px 96px minmax(0,1fr); gap:0 12px; padding:9px 14px; border-top:1px solid var(--hair)}
  .vlist:first-child li:first-child{border-top:0}
  .vlist .v{font-weight:600} .vlist .when{color:var(--muted); font-size:13px}
  .vlist .what{color:var(--ink)}
  .current{display:inline-block; margin-left:6px; font-size:11px; color:var(--good); font-weight:600}
  .older{margin:0} .older>summary{padding:9px 14px; border-top:1px solid var(--hair); font-size:13px}

  @media (max-width:620px){
    .chg dl,.ro{grid-template-columns:minmax(0,1fr); gap:2px 0}
    .chg dd,.ro dd{margin-bottom:8px}
    .vlist li{grid-template-columns:minmax(0,1fr)}
    .f-number,.f-choice,.body>.fields>.f-text{grid-column:span 6}
    /* under 16px, iOS zooms the page when a control takes focus */
    input[type=text],input[type=url],select,textarea,.f textarea,.f textarea.area{font-size:16px}
    .set>details>summary,a.set.open{padding:13px 14px}
    details.item>summary{padding:11px 10px}
    .savebar{flex-wrap:nowrap}
    .savebar input[type=text]{flex:1 1 0}
    .savebar button{padding:8px 12px; flex:none}
    .savebar button.primary{min-width:0}
  }
</style>
</head>
<body><div class="wrap">
<nav>
  <a class="brand" href="/">Jobs</a>
  <a href="/" class="{{ 'on' if path == '/' }}">Today</a>
  {% for c in catchups %}<a href="/catchup/{{ c.name }}" class="{{ 'on' if path == '/catchup/' ~ c.name }}">{{ c.title }}</a>{% endfor %}
  <a href="/watchlist" class="{{ 'on' if path.startswith('/watchlist') }}">Watchlist</a>
  <a href="/profile" class="{{ 'on' if path.startswith('/profile') }}">Profile</a>
  <a href="/coverage" class="{{ 'on' if path == '/coverage' }}">Coverage</a>
  <span class="who">{{ email }}</span>
</nav>
{% block body %}{% endblock %}
</div></body>
</html>
